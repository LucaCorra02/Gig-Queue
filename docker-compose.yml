networks:
  gig-net:
    driver: bridge

volumes:
  redis-data:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:

    # Common Kafka configuration

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1

  environment: &kafka-common-env
    KAFKA_PROCESS_ROLES: broker,controller
    KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:9091,2@kafka-2:9091,3@kafka-3:9091
    CLUSTER_ID: "nJpPclpaSoaVt5igUjTQxQ"
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    KAFKA_LOG_DIRS: /var/lib/kafka/data

    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

services:

  # Kafka Broker
  kafka-1:
    <<: *kafka-common
    hostname: kafka-1
    container_name: kafka-1
    ports:
      - "9092:9092"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9093 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 1
      KAFKA_LISTENERS: CONTROLLER://kafka-1:9091,INTERNAL://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-1:9093,EXTERNAL://127.0.0.1:9092
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks: [ gig-net ]

  kafka-2:
    <<: *kafka-common
    hostname: kafka-2
    container_name: kafka-2
    ports:
      - "9094:9094"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9095 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 2
      KAFKA_LISTENERS: CONTROLLER://kafka-2:9091,INTERNAL://0.0.0.0:9095,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-2:9095,EXTERNAL://127.0.0.1:9094
    volumes:
      - kafka-2-data:/var/lib/kafka/data
    networks: [ gig-net ]

  kafka-3:
    <<: *kafka-common
    hostname: kafka-3
    container_name: kafka-3
    ports:
      - "9096:9096"
    healthcheck:
      test: [ "CMD-SHELL", "nc -z localhost 9097 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    environment:
      <<: *kafka-common-env
      KAFKA_NODE_ID: 3
      KAFKA_LISTENERS: CONTROLLER://kafka-3:9091,INTERNAL://0.0.0.0:9097,EXTERNAL://0.0.0.0:9096
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka-3:9097,EXTERNAL://127.0.0.1:9096
    volumes:
      - kafka-3-data:/var/lib/kafka/data
    networks: [ gig-net ]

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-init
    depends_on:
      kafka-1: { condition: service_healthy }
      kafka-2: { condition: service_healthy }
      kafka-3: { condition: service_healthy }
    command:
      - /bin/bash
      - -c
      - |
        kafka-topics --bootstrap-server kafka-1:9093 --create --if-not-exists --topic topic-requests --partitions 3 --replication-factor 3 --config min.insync.replicas=2
        kafka-topics --bootstrap-server kafka-1:9093 --create --if-not-exists --topic topic-orders --partitions 1 --replication-factor 3 --config min.insync.replicas=2
        kafka-topics --bootstrap-server kafka-1:9093 --create --if-not-exists --topic topic-fraud --partitions 1 --replication-factor 3
        kafka-topics --bootstrap-server kafka-1:9093 --create --if-not-exists --topic topic-dlq --partitions 1 --replication-factor 3

        echo "Cluster topics:"
        kafka-topics --bootstrap-server kafka-1:9093 --list
    networks: [ gig-net ]

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    networks: [ gig-net ]

  # Services
  ticket-api:
    build: ./services/ticket-api
    container_name: ticket-api
    ports:
      - "8080:8080"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9093,kafka-2:9095,kafka-3:9097
      TOPIC_REQUESTS: topic-requests
      HTTP_ADDR: ":8080"
      REDIS_URL: redis://redis:6379/0
      QUEUE_TTL_S: 86400
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [gig-net]

  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    restart: on-failure
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP: kafka-1:9093,kafka-2:9095,kafka-3:9097
      TOPIC_REQUESTS: topic-requests
      TOPIC_ORDERS: topic-orders
      TOPIC_DLQ: topic-dlq
      GROUP_ID: group-inventory
      REDIS_URL: redis://redis:6379/0
      SEATS_PER_EVENT: 100
    networks: [gig-net]


  # Kafka GUI
  akhq:
    image: tchiotludo/akhq:latest
    container_name: akhq
    ports:
      - "8090:8080"
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            gig-queue-cluster:
              properties:
                bootstrap.servers: "kafka-1:9093,kafka-2:9095,kafka-3:9097"
    networks: [ gig-net ]
