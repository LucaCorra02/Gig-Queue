<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gig-Queue console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --ink: #0F1621;
            --panel: #17202D;
            --rule: #27323F;
            --amber: #E9A33C;
            --live: #62B49B;
            --down: #D25B4F;
            --text: #DAE2EA;
            --muted: #7C8CA0;
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--ink);
            color: var(--text);
            font-family: 'Barlow Semi Condensed', system-ui, sans-serif;
            font-size: 16px
        }

        .num {
            font-family: 'IBM Plex Mono', monospace;
            font-variant-numeric: tabular-nums
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 24px
        }

        header {
            display: flex;
            align-items: baseline;
            gap: 20px;
            border-bottom: 2px solid var(--rule);
            padding-bottom: 14px;
            margin-bottom: 26px
        }

        h1 {
            font-size: 30px;
            font-weight: 600;
            margin: 0
        }

        .status {
            color: var(--muted);
            font-size: 15px
        }

        .status b {
            color: var(--live);
            font-weight: 500
        }

        .status b.bad {
            color: var(--down)
        }

        h2 {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 8px
        }

        .hint {
            color: var(--muted);
            font-size: 14px;
            margin: 0 0 14px
        }

        .board {
            border: 1px solid var(--rule);
            background: var(--panel)
        }

        .topic {
            border-bottom: 1px solid var(--rule)
        }

        .topic:last-child {
            border-bottom: 0
        }

        .topic h3 {
            margin: 0;
            padding: 9px 14px;
            font-size: 16px;
            font-weight: 500;
            color: var(--muted);
            background: rgba(0, 0, 0, .18)
        }

        .parts {
            display: flex;
            flex-wrap: wrap;
            gap: 1px;
            background: var(--rule)
        }

        .part {
            flex: 1 1 190px;
            background: var(--panel);
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 12px
        }

        .part .p {
            color: var(--muted);
            font-size: 14px;
            width: 34px
        }

        .part .lead {
            font-size: 18px;
            color: var(--amber)
        }

        .part .leadt {
            font-size: 16px;
            color: var(--muted)
        }

        .isr {
            display: flex;
            gap: 5px;
            margin-left: auto
        }

        .chip {
            width: 23px;
            height: 23px;
            line-height: 22px;
            text-align: center;
            font-size: 13px;
            border: 1px solid var(--live);
            color: var(--live);
            border-radius: 2px
        }

        .chip.out {
            border-color: var(--down);
            color: var(--down);
            border-style: dashed;
            opacity: .7
        }

        .empty {
            color: var(--muted);
            font-style: italic;
            padding: 14px
        }

        .nodes {
            display: flex;
            gap: 1px;
            background: var(--rule);
            border: 1px solid var(--rule);
            margin-bottom: 22px
        }

        .node {
            flex: 1;
            background: var(--panel);
            padding: 12px 14px
        }

        .node.off {
            background: rgba(210, 91, 79, .07)
        }

        .node .id {
            font-size: 22px;
            color: var(--live)
        }

        .node.off .id {
            color: var(--down)
        }

        .node .host {
            font-size: 13px;
            color: var(--muted)
        }

        .node .role {
            font-size: 13px;
            color: var(--amber);
            margin-top: 3px
        }

        .node.off .role {
            color: var(--down)
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 15px;
            margin-top: 4px
        }

        th {
            text-align: left;
            font-weight: 500;
            color: var(--muted);
            padding: 0 10px 7px 0;
            border-bottom: 1px solid var(--rule)
        }

        td {
            padding: 10px 10px 10px 0;
            border-bottom: 1px solid rgba(39, 50, 63, .55)
        }

        th.r,
        td.r {
            text-align: right;
            padding-right: 0
        }

        tr.idle {
            opacity: .45
        }

        .ev {
            font-size: 14px;
            color: var(--muted)
        }

        .bar {
            height: 5px;
            background: var(--rule);
            margin-top: 6px;
            max-width: 260px
        }

        .bar span {
            display: block;
            height: 100%;
            background: var(--amber)
        }
    </style>
</head>

<body>
    <div class="wrap">
        <header>
            <h1>Gig-Queue</h1>
            <div class="status" id="status">connecting</div>
        </header>

        <section>
            <h2>Cluster</h2>
            <div class="nodes" id="nodes"></div>
            <p class="hint">Leader and in-sync replicas per partition</p>
            <div class="board" id="board">
                <div class="empty">waiting for the first reading</div>
            </div>
        </section>
        <section>
            <h2>Queues</h2>
            <p class="hint">Counters written by the services. Ahead is seq &minus; done;
                the estimate divides it by the rate observed over the last minute.</p>
            <table>
                <thead>
                    <tr>
                        <th>Event</th>
                        <th class="r">Ahead</th>
                        <th class="r">Served</th>
                        <th class="r">Rate</th>
                        <th class="r">Est.</th>
                        <th class="r">Seats left</th>
                    </tr>
                </thead>
                <tbody id="queues">
                    <tr>
                        <td colspan="6" class="empty">no event yet</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </div>

    <script>
        function renderBoard(cluster) {
            document.getElementById("board").innerHTML = cluster.topics.map(topic => `
            <div class="topic">
            <h3>${topic.name}</h3>
            <div class="parts">${topic.partitions.map(p => `
                <div class="part">
                <span class="p">p${p.id}</span>
                <span class="leadt">Broker leader: </span>
                <span class="lead num">${p.leader >= 0 ? p.leader : "—"}</span>
                <span class="isr">${p.replicas.map(r =>
                `<span class="chip ${p.isr.includes(r) ? "" : "out"}">${r}</span>`
            ).join("")}</span>
                </div>`).join("")}</div>
            </div>`).join("");

            renderNodes(cluster);

            const t = cluster.totals;
            document.getElementById("status").innerHTML =
                `<b class="${t.brokers_online === t.brokers_expected ? "" : "bad"}">`
                + `${t.brokers_online} of ${t.brokers_expected} brokers</b> online`
                + ` &middot; ${t.partitions} partitions`
                + (t.under_replicated ? ` &middot; <b class="bad">${t.under_replicated} under-replicated</b>` : "")
                + (t.offline ? ` &middot; <b class="bad">${t.offline} without a leader</b>` : "");

        }

        async function refresh() {
            try {
                const state = await (await fetch("/api/state")).json();
                renderBoard(state.cluster);
                renderQueues(state.events);
            } catch (err) {
                document.getElementById("status").innerHTML = `<b class="bad">console offline</b>`;
            }
        }

        function renderNodes(cluster) {
            document.getElementById("nodes").innerHTML = cluster.brokers.map(b => `
                <div class="node ${b.online ? "" : "off"}">
                <div class="id num">${b.id}</div>
                <div class="host">${b.online ? b.host : "offline"}</div>
                <div class="role">${b.online
                    ? `leads ${b.leading} ${b.leading === 1 ? "partition" : "partitions"}`
                    : "no replicas served"}</div>
                </div>`).join("");
        }

        function renderQueues(events) {
            const body = document.getElementById("queues");
            if (!events.length) {
                body.innerHTML = `<tr><td colspan="6" class="empty">no event yet</td></tr>`;
                return;
            }
            body.innerHTML = events.map(e => {
                const pct = e.total ? Math.min(100, Math.round(100 * e.sold / e.total)) : 0;
                return `<tr class="${e.active ? "" : "idle"}">
                    <td>${e.id}
                        <div class="bar"><span style="width:${pct}%"></span></div>
                        <div class="ev">${e.sold} of ${e.total} seats sold</div></td>
                    <td class="r num">${e.ahead}</td>
                    <td class="r num">${e.done}</td>
                    <td class="r num">${e.rate.toFixed(1)}/s</td>
                    <td class="r num">${e.eta === null ? "—" : e.eta + "s"}</td>
                    <td class="r num">${e.seats_left}</td>
                    </tr>`;
            }).join("");
        }

        refresh();
        setInterval(refresh, 2000);
    </script>
</body>

</html>
